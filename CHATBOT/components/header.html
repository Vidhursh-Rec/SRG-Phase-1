<header class="chat-header">

    <div class="header-left">

        <button
            class="back-button"
            id="back-button"
            type="button"
            aria-label="Sign out"
            title="Sign out"
        >
            ←
        </button>

        <img
            src="assets/images/srg-logo.png"
            alt="SRG Guardrail Logo"
            class="header-logo"
            onerror="this.style.display='none'"
        >

    </div>


    <div class="header-title">

        <h1>SRG Support Bot</h1>

        <p>
            AI-Powered Support
            <span>•</span>
            SRG Protected
        </p>

    </div>


    <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Toggle dark mode"
        title="Toggle dark mode"
    >
        <span id="theme-icon">☾</span>
    </button>


</header>
