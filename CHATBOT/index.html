<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer support chatbot</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23e53935' d='M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.5 6.4 4.5c2.1 0 3.8 1.2 5.6 3.3 1.8-2.1 3.5-3.3 5.6-3.3 3.7 0 5.5 3.9 4 7.3C19.5 16.4 12 21 12 21z'/%3E%3C/svg%3E"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="chatbot.css">
    <link rel="stylesheet" href="components/header.css">
    <link rel="stylesheet" href="components/topbar.css">
    <link rel="stylesheet" href="components/status.css">
    <link rel="stylesheet" href="components/contact.css">
    <link rel="stylesheet" href="components/chat.css">
    <link rel="stylesheet" href="components/input.css">
</head>

<body>

    <!-- apply saved theme before first paint (no flash) -->
    <script>
        if (localStorage.getItem("srg-theme") === "dark") {
            document.body.classList.add("dark-theme");
        }
    </script>

    <div class="chatbot-page">

        <div id="header-component"></div>

        <div id="topbar-component"></div>

        <main class="main-content">

            <!-- left: chat + composer -->
            <div class="chat-column">
                <div id="chat-component"></div>
                <div id="input-component"></div>
            </div>

            <!-- right: SRG status + support centre -->
            <aside class="side-panel">
                <div id="status-component"></div>
                <div id="contact-component"></div>
            </aside>

        </main>

    </div>

    <script src="chatbot.js"></script>
</body>
</html>
