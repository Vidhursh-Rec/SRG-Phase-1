<section
    class="chat-area"
    id="chat-area"
    role="log"
    aria-live="polite"
    aria-label="Conversation"
>

    <div class="chat-date">
        Today
    </div>

    <div class="message bot-message">

        <div class="message-avatar" aria-hidden="true">
            🛡
        </div>

        <div class="message-content">

            <div class="message-sender">
                SRG Support Bot
            </div>

            <div class="message-bubble">Hi! Welcome to SRG Support. How can I assist you today?</div>

            <div class="message-time">
                Just now
            </div>

        </div>

    </div>

</section>
