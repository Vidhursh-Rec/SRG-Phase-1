<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SRG Mart | Login</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f8cb46' stroke='%23d99a00' stroke-width='1' stroke-linejoin='round' d='M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.5 6.4 4.5c2.1 0 3.8 1.2 5.6 3.3 1.8-2.1 3.5-3.3 5.6-3.3 3.7 0 5.5 3.9 4 7.3C19.5 16.4 12 21 12 21z'/%3E%3C/svg%3E"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-page">

    <!-- LEFT: promo -->
    <section class="promo">

        <div class="brand">
            <span>srg</span><span class="mart">mart</span>
        </div>

        <h1>Groceries delivered in 10 minutes</h1>

        <figure class="promo-photo">
            <img
                src="assets/images/srg-team-pixel.png"
                alt="SRG Project team pixel art"
            >
            <figcaption>Three minds. One guardrail.</figcaption>
        </figure>

        <p>
            Fresh fruits, dairy, snacks and more, at your door before you know it.
        </p>

        <div class="promo-emojis" aria-hidden="true">
            <span>🍎</span>
            <span>🥛</span>
            <span>🍞</span>
            <span>🥕</span>
            <span>🍫</span>
            <span>🧃</span>
        </div>

    </section>


    <!-- RIGHT: login / register -->
    <main class="login-side">

        <section class="login-card">

            <div class="brand brand-mobile">
                <span>srg</span><span class="mart">mart</span>
            </div>

            <div class="form-header">

                <h2 id="form-title">
                    Welcome back
                </h2>

                <p id="form-subtitle">
                    Log in to start shopping.
                </p>

            </div>


            <!-- LOGIN FORM -->
            <form id="login-form">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-password"
                            aria-label="Show password"
                        >
                            ◉
                        </button>

                    </div>

                </div>


                <div class="login-options">

                    <label class="remember-option">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a
                        href="#"
                        id="forgot-password"
                    >
                        Forgot password?
                    </a>

                </div>


                <p id="login-error"></p>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>


                <div class="account-switch">

                    <span>
                        New user?
                    </span>

                    <button
                        type="button"
                        id="create-account"
                    >
                        Create account
                    </button>

                </div>

            </form>


            <!-- REGISTER FORM -->
            <form
                id="register-form"
                style="display:none;"
            >

                <div class="form-group">

                    <label for="register-username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="register-username"
                        placeholder="Create username"
                        autocomplete="username"
                    >

                </div>


                <div class="form-group">

                    <label for="register-password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="register-password"
                            placeholder="Create password"
                            autocomplete="new-password"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirm-password">
                        Confirm password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirm-password"
                            placeholder="Confirm password"
                            autocomplete="new-password"
                        >

                    </div>

                </div>


                <p id="register-error"></p>


                <button
                    type="submit"
                    class="login-button"
                >
                    Create account
                </button>


                <div class="account-switch">

                    <span>
                        Already registered?
                    </span>

                    <button
                        type="button"
                        id="back-to-login"
                    >
                        Back to login
                    </button>

                </div>

            </form>

        </section>

        <p class="login-footnote">
            Protected by SRG Guardrail · v1.0
        </p>

    </main>

</div>

<script src="login.js"></script>

</body>
</html>
