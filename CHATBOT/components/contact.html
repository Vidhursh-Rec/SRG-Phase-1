<section class="contact">

    <div class="contact-head">

        <div>
            <h2>Support Centre</h2>
            <p>Offline customer service</p>
        </div>

        <span class="open-badge" id="office-open" aria-live="polite"></span>

    </div>


    <div class="map-card">

        <iframe
            id="office-map"
            title="Support centre location"
            loading="lazy"
            referrerpolicy="no-referrer"
            tabindex="-1"
        ></iframe>

        <!-- click anywhere on the map: opens full Google Maps -->
        <a
            class="map-open"
            id="office-map-link"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open support centre location in Google Maps"
        >
            <span class="map-hint">Open in Maps ↗</span>
        </a>

    </div>


    <div class="office-info">

        <p class="office-name" id="office-name"></p>

        <p class="office-address" id="office-address"></p>

        <a
            class="link"
            id="office-directions"
            target="_blank"
            rel="noopener noreferrer"
        >
            Get directions ↗
        </a>

    </div>


    <div class="contact-row">

        <span class="contact-label">Email</span>

        <a class="link" id="office-email"></a>

    </div>

</section>
