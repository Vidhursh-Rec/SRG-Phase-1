<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SRG Mart</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f8cb46' stroke='%23d99a00' stroke-width='1' stroke-linejoin='round' d='M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.5 6.4 4.5c2.1 0 3.8 1.2 5.6 3.3 1.8-2.1 3.5-3.3 5.6-3.3 3.7 0 5.5 3.9 4 7.3C19.5 16.4 12 21 12 21z'/%3E%3C/svg%3E"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="shop.css">
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="shop-header">

    <a class="brand" href="shop.html" aria-label="SRG Mart home">
        <span>srg</span><span class="mart">mart</span>
    </a>

    <div class="delivery">
        <strong>Delivery in 10 minutes</strong>
        <span>Home ▾</span>
    </div>

    <label class="search">
        <span aria-hidden="true">🔍</span>
        <input
            type="search"
            id="search"
            placeholder='Search "milk"'
            autocomplete="off"
            aria-label="Search products"
        >
    </label>

    <div class="user-box">
        <span class="user-name" id="user-name"></span>
        <button type="button" id="logout" class="link-btn">Logout</button>
    </div>

    <button type="button" id="cart-button" class="cart-btn">
        <span aria-hidden="true">🛒</span>
        <span id="cart-label">My Cart</span>
    </button>

</header>


<!-- ============ PAGE ============ -->
<main class="shop-main">

    <section class="banner">
        <div>
            <h1>Groceries in 10 minutes</h1>
            <p>Fresh picks, daily essentials, snacks and more.</p>
        </div>
        <div class="banner-emojis" aria-hidden="true">🥦 🍌 🥛 🍞</div>
    </section>

    <nav class="categories" id="categories" aria-label="Categories"></nav>

    <div id="product-sections"></div>

    <p class="empty" id="empty" hidden>No products match your search.</p>

</main>


<!-- ============ SUPPORT CHAT: side toggle + drawer ============ -->
<button
    type="button"
    id="chat-toggle"
    class="chat-toggle"
    aria-controls="chat-drawer"
    aria-expanded="false"
>
    <span aria-hidden="true">💬</span>
    <span class="chat-toggle-text">Order support</span>
</button>

<div class="chat-backdrop" id="chat-backdrop"></div>

<aside
    class="chat-drawer"
    id="chat-drawer"
    aria-label="Customer support chat"
    aria-hidden="true"
>
    <!-- chatbot is loaded here the first time the drawer opens -->
    <iframe
        id="chat-frame"
        title="Customer support chatbot"
    ></iframe>
</aside>

<!-- ============ CART DRAWER ============ -->
<div class="cart-backdrop" id="cart-backdrop"></div>

<aside class="cart-drawer" id="cart-drawer" aria-label="Your cart" aria-hidden="true">
    <div class="cart-drawer-header">
        <h2>My Cart</h2>
        <button type="button" id="cart-close" class="cart-close-btn" aria-label="Close cart">✕</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer" id="cart-footer"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="shop.js"></script>
</body>
</html>
